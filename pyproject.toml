[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval"
version = "0.1.0"
description = "Evaluation-first Retrieval-Augmented Generation system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RAG-Eval contributors" }]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.141,<1",
    "httpx>=0.27,<1",
    "pillow>=12.3,<13",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3.13,<1",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.10.1,<1.11",
    "redis>=8.1.0,<9",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
observability = [
    "langfuse>=4,<5",
]
dev = [
    "detect-secrets>=1.5,<2",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that require local infrastructure",
    "live_provider: tests that require external provider credentials",
    "local_ocr: tests that require the local Tesseract binary",
    "benchmark: non-CI benchmark tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["rageval"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unused_configs = true
