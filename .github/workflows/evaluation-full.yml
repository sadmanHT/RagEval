name: Scheduled Evaluation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run available full deterministic evaluation matrix
        run: |
          mkdir -p artifacts
          python scripts/evaluation_ablation_fixture_report.py > artifacts/comparative-evaluation.json
      - name: Evaluate scheduled regression alert policy
        run: python scripts/evaluation_gate.py --mode nightly > artifacts/nightly-regression-alert.json
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-evaluation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
