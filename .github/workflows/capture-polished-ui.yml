name: Capture polished frontend visual

on:
  workflow_dispatch:
  push:
    branches: [frontend-ui-polish]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start product stack
        env:
          RAGEVAL_SERVING_API_KEY: visual-check-key
        run: |
          docker compose up -d --build qdrant redis api frontend
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001 >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Install Chromium capture tool
        run: sudo apt-get update && sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: Capture full console
        run: |
          BIN=$(command -v chromium-browser || command -v chromium)
          "$BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1700 --screenshot="$PWD/rageval-console-polished.png" http://127.0.0.1:3001
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: rageval-frontend-polished
          path: rageval-console-polished.png
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
