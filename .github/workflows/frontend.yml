name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan frontend surfaces
        run: |
          python -m pip install 'detect-secrets>=1.5,<2'
          detect-secrets scan . ../scripts/frontend_smoke.py \
            ../.github/workflows/frontend.yml ../docker-compose.yml \
            > /tmp/frontend-detect-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/frontend-detect-secrets.json').read_text())
          results = payload.get('results', {})
          if results:
              for path, findings in sorted(results.items()):
                  for finding in findings:
                      print(
                          f"secret candidate: {path}:{finding.get('line_number')} "
                          f"{finding.get('type')}"
                      )
              raise SystemExit('detect-secrets found unreviewed frontend candidates')
          print('detect-secrets: no frontend candidates')
          PY

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Start API and frontend stack
        env:
          RAGEVAL_SERVING_API_KEY: frontend-ci-local-key  # pragma: allowlist secret
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --build qdrant redis api frontend
      - name: Frontend product smoke
        run: python scripts/frontend_smoke.py
      - name: Assert frontend runtime is non-root
        run: |
          uid=$(docker compose exec -T frontend id -u)
          test "$uid" != "0"
          echo "frontend_runtime_uid=$uid"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
