name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-01-foundation

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint diagnostic
        run: |
          ruff check --fix src/rageval/retrieval/sparse/models.py
          git diff -- src/rageval/retrieval/sparse/models.py
          git diff --exit-code -- src/rageval/retrieval/sparse/models.py
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest -q tests/unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Validate Compose
        run: docker compose config
      - name: Start infrastructure
        run: |
          docker compose up -d qdrant redis
          python scripts/wait_for_services.py
      - name: Integration tests
        run: pytest -q tests/integration
      - name: Cleaning fixture stats
        run: python scripts/cleaning_fixture_report.py
      - name: Chunking fixture ablation
        run: python scripts/chunking_fixture_report.py
      - name: Dense Qdrant fixture evidence
        run: python scripts/dense_fixture_report.py
      - name: Sparse BM25 fixture evidence
        run: python scripts/sparse_fixture_report.py
      - name: Package smoke test
        run: python -m rageval.smoke
      - name: Full regression suite
        run: pytest -q
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  local-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Local OCR fixture
        run: pytest -q -m local_ocr tests/integration/test_local_ocr.py
