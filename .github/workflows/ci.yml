name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-01-foundation

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest -q tests/unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Validate Compose
        run: docker compose config
      - name: Start infrastructure
        run: |
          docker compose up -d qdrant redis
          python scripts/wait_for_services.py
      - name: Integration tests
        run: pytest -q tests/integration
      - name: Cleaning fixture stats
        run: python scripts/cleaning_fixture_report.py
      - name: Chunking fixture ablation
        run: python scripts/chunking_fixture_report.py
      - name: Dense Qdrant fixture evidence
        run: python scripts/dense_fixture_report.py
      - name: Sparse BM25 fixture evidence
        run: python scripts/sparse_fixture_report.py
      - name: Hybrid RRF fixture evidence
        run: python scripts/hybrid_fixture_report.py
      - name: Reranked retrieval service fixture evidence
        run: python scripts/retrieval_service_fixture_report.py
      - name: Grounded generation fixture evidence
        run: python scripts/generation_fixture_report.py
      - name: Evaluation metrics fixture evidence
        run: python scripts/evaluation_fixture_report.py
      - name: PR-fast deterministic evaluation gate
        run: python scripts/evaluation_gate.py --mode pr
      - name: Comparative evaluation ablation fixture evidence
        run: python scripts/evaluation_ablation_fixture_report.py
      - name: Serving API fixture evidence
        run: python scripts/serving_fixture_report.py
      - name: Package smoke test
        run: python -m rageval.smoke
      - name: Full regression suite
        run: pytest -q
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build non-root runtime image from clean context
        run: docker build --target runtime -t rageval-api:ci .
      - name: Build containerized full-suite image
        run: docker build --target test -t rageval-test:ci .
      - name: Assert runtime is non-root
        run: |
          docker run --rm --entrypoint python rageval-api:ci -c \
            'import os; assert os.getuid() != 0, os.getuid(); print(f"runtime_uid={os.getuid()}")'
      - name: Start complete operational stack from clean volumes
        env:
          RAGEVAL_SERVING_API_KEY: phase14-ci-local-key  # pragma: allowlist secret
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --build qdrant redis api prometheus grafana
      - name: Operational HTTP and observability smoke
        env:
          RAGEVAL_SERVING_API_KEY: phase14-ci-local-key  # pragma: allowlist secret
        run: |
          docker run --rm --network host \
            -e RAGEVAL_SERVING_API_KEY \
            rageval-test:ci python scripts/operational_smoke.py
      - name: Entire repository suite inside containerized environment
        run: |
          docker run --rm --network host \
            -e RAGEVAL_QDRANT_URL=http://127.0.0.1:6333 \
            -e RAGEVAL_REDIS_URL=redis://127.0.0.1:6379/0 \
            rageval-test:ci pytest -q
      - name: Real full-system validation inside test container
        run: |
          docker run --rm --network host \
            -e GITHUB_SHA \
            -e RAGEVAL_QDRANT_URL=http://127.0.0.1:6333 \
            -e RAGEVAL_REDIS_URL=redis://127.0.0.1:6379/0 \
            rageval-test:ci \
            python scripts/full_system_validation.py \
              --artifact-dir /tmp/phase15-container --require-ocr
      - name: Simulate Qdrant outage and verify readiness plus metrics
        run: |
          docker compose stop qdrant
          code=000
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/readiness.json -w '%{http_code}' \
              http://127.0.0.1:8000/health/ready || true)
            if [ "$code" = "503" ]; then
              break
            fi
            sleep 1
          done
          test "$code" = "503"
          cat /tmp/readiness.json
          curl -fsS http://127.0.0.1:8000/metrics | \
            grep -F 'rageval_dependency_ready{component="qdrant"} 0.0'
      - name: Restart Qdrant and verify readiness recovery
        run: |
          docker compose start qdrant
          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/readiness-recovered.json -w '%{http_code}' \
              http://127.0.0.1:8000/health/ready || true)
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 1
          done
          test "$code" = "200"
          cat /tmp/readiness-recovered.json
          curl -fsS http://127.0.0.1:8000/metrics | \
            grep -F 'rageval_dependency_ready{component="qdrant"} 1.0'
      - name: Operational logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down operational stack
        if: always()
        run: docker compose down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip 'setuptools>=83,<85'
          pip install -e '.[dev]'
      - name: Python dependency audit
        run: pip-audit
      - name: Secret scan of production and operational surfaces
        run: |
          detect-secrets scan src .github Dockerfile docker-compose.yml Makefile \
            scripts/operational_smoke.py scripts/evaluation_gate.py \
            scripts/full_system_validation.py \
            scripts/phase15_evaluation_reconciliation.py > /tmp/detect-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/detect-secrets.json').read_text())
          results = payload.get('results', {})
          if results:
              for path, findings in sorted(results.items()):
                  for finding in findings:
                      print(
                          f"secret candidate: {path}:{finding.get('line_number')} "
                          f"{finding.get('type')}"
                      )
              raise SystemExit('detect-secrets found unreviewed candidates')
          print('detect-secrets: no candidates')
          PY

  local-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Local OCR fixture
        run: pytest -q -m local_ocr tests/integration/test_local_ocr.py

  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deterministic release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Start clean Qdrant and Redis
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d qdrant redis
          python scripts/wait_for_services.py
      - name: Full-system validation and measured benchmark
        run: |
          mkdir -p artifacts/phase15
          python scripts/full_system_validation.py \
            --artifact-dir artifacts/phase15/full-system \
            --require-ocr \
            > artifacts/phase15/full-system-stdout.json
      - name: Reviewed-set ablation reconciliation
        run: |
          python scripts/phase15_evaluation_reconciliation.py \
            --output-dir artifacts/phase15/ablation \
            > artifacts/phase15/reconciliation-stdout.json
      - name: Validate release artifacts are machine-readable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          validation = json.loads(
              Path('artifacts/phase15/full-system/full-system-validation.json').read_text()
          )
          reconciliation = json.loads(
              Path('artifacts/phase15/ablation/phase15-reconciliation.json').read_text()
          )
          assert validation['release_gate_passed'] is True
          assert validation['evaluation']['reviewed_record_count'] == 3
          assert reconciliation['reviewed_record_count'] == 3
          assert reconciliation['target_200_available'] is False
          print('phase15 release artifacts validated')
          PY
      - name: Upload Phase 15 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-release-evidence-${{ github.run_id }}
          path: artifacts/phase15/
          if-no-files-found: error
          retention-days: 30
      - name: Release-validation logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down release infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
