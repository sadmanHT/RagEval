name: Capture portfolio screenshots

on:
  push:
    branches:
      - portfolio-professional-pass

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start complete product stack
        env:
          RAGEVAL_SERVING_API_KEY: portfolio-capture-local-key  # pragma: allowlist secret
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: portfolio-grafana-local-key  # pragma: allowlist secret
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --build qdrant redis api frontend prometheus grafana
      - name: Populate product and observability state
        env:
          RAGEVAL_SERVING_API_KEY: portfolio-capture-local-key  # pragma: allowlist secret
        run: |
          python scripts/operational_smoke.py
          python scripts/frontend_smoke.py
      - name: Install browser capture dependencies
        run: |
          mkdir -p /tmp/rageval-capture
          cd /tmp/rageval-capture
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture healthy product and Grafana surfaces
        env:
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: portfolio-grafana-local-key  # pragma: allowlist secret
        run: |
          cat > /tmp/rageval-capture/capture.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });

          const product = await browser.newPage({ viewport: { width: 1440, height: 1050 }, deviceScaleFactor: 1 });
          await product.goto('http://127.0.0.1:3001', { waitUntil: 'networkidle' });
          await product.getByText('System healthy').waitFor({ state: 'visible', timeout: 120000 });
          await product.getByText('All systems nominal').waitFor({ state: 'visible', timeout: 120000 });
          await product.screenshot({ path: 'docs/assets/product-console.png', fullPage: true });

          const grafana = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          await grafana.goto('http://127.0.0.1:3000/login', { waitUntil: 'networkidle' });
          await grafana.locator('input[name="user"]').fill(process.env.GRAFANA_ADMIN_USER);
          await grafana.locator('input[name="password"]').fill(process.env.GRAFANA_ADMIN_PASSWORD);
          await grafana.locator('button[type="submit"]').click();
          await grafana.waitForLoadState('networkidle');
          await grafana.goto('http://127.0.0.1:3000/d/rageval-operational/rag-eval-operational-overview?orgId=1&from=now-15m&to=now&refresh=30s', { waitUntil: 'networkidle' });
          await grafana.getByText('HTTP request rate').waitFor({ state: 'visible', timeout: 120000 });
          await grafana.waitForTimeout(3000);
          await grafana.screenshot({ path: 'docs/assets/grafana-dashboard.png', fullPage: true });

          await browser.close();
          JS
          node /tmp/rageval-capture/capture.mjs
      - name: Commit portfolio screenshots and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/capture-portfolio-screenshot.yml
          git add docs/assets/product-console.png docs/assets/grafana-dashboard.png
          git commit -m "Add healthy portfolio screenshots"
          git push origin HEAD:portfolio-professional-pass
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
